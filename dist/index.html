<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#e7ddcb">
  <meta name="description" content="MYCITY — 三维产品街区">
  <link rel="canonical" href="https://mycity.up.railway.app/">
  <meta property="og:url" content="https://mycity.up.railway.app/">
  <meta property="og:type" content="website">
  <meta property="og:title" content="MYCITY">
  <title>MYCITY</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 80 80'%3E%3Crect width='80' height='80' rx='20' fill='%233d3023'/%3E%3Cpath d='M17 57V33l14-13 13 13v24M44 57V39l12-10 9 10v18M12 58h58M26 58V43h10v15' fill='none' stroke='%23f4e7ce' stroke-width='4'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://mycity-assets.lafreze-city.workers.dev" crossorigin>
  <link rel="stylesheet" href="./styles.css?v=3d-only-2">
  <script type="importmap">{"imports":{"three":"./vendor/three/three.module.js","three/addons/":"./vendor/three/addons/"}}</script>
</head>
<body data-scene-state="loading">
  <main id="scene3d" aria-label="三维产品街区"></main>
  <header class="topbar">
    <button id="home" class="brand" aria-label="回到街区全景" data-scene-control disabled>MYCITY</button>
    <div class="glass toolbar">
      <button id="products-toggle" aria-expanded="false" aria-controls="product-menu">作品</button>
      <span class="divider"></span>
      <button id="night-toggle" class="icon" aria-label="切换夜景" title="夜景" aria-pressed="false" data-scene-control disabled>☾</button>
    </div>
  </header>

  <aside id="product-menu" class="glass panel" aria-label="作品列表" hidden>
    <div class="panel-top"><span>作品</span><button id="close-menu" class="icon" aria-label="关闭作品列表">×</button></div>
    <div id="product-items"></div>
  </aside>

  <div class="dock" aria-label="街区控制">
    <div class="glass timeline" role="group" aria-label="城市年份">
      <button id="play-timeline" class="icon" aria-label="播放城市成长" aria-pressed="false" data-scene-control disabled>▷</button>
      <div id="year-buttons"></div>
    </div>
    <div class="glass camera" role="group" aria-label="视角">
      <button id="canal-view" data-scene-control disabled>河岸</button>
      <button id="overhead-view" data-scene-control disabled>俯瞰</button>
      <button id="orbit-toggle" class="icon" title="环游" aria-label="自动环游" aria-pressed="false" data-scene-control disabled>◌</button>
      <span class="divider"></span>
      <button id="zoom-out" class="icon" aria-label="缩小" data-scene-control disabled>−</button>
      <button id="zoom-in" class="icon" aria-label="放大" data-scene-control disabled>＋</button>
      <button id="reset-scene" class="icon" title="复位" aria-label="恢复全景" data-scene-control disabled>⟲</button>
    </div>
  </div>

  <div id="loading" class="loading">
    <div id="load-state" role="status"><span class="spinner" aria-hidden="true"></span><span id="loading-label">载入街区</span><progress id="loading-progress" max="5" value="0" aria-label="建筑加载进度"></progress></div>
    <div id="load-error" hidden><p id="error-message">加载失败，请重试。</p><button id="retry" class="solid">重试</button></div>
  </div>
  <div id="asset-status" class="asset-status glass" role="status" hidden><span id="asset-label"></span><button id="retry-assets" hidden>重试</button></div>

  <dialog id="product-dialog" aria-labelledby="detail-title">
    <button id="close-detail" class="close icon" aria-label="关闭作品详情">×</button>
    <p id="detail-meta" class="meta"></p>
    <h2 id="detail-title"></h2>
    <p id="detail-description"></p>
    <div id="detail-update" class="update" hidden><time id="update-date"></time><span id="update-title"></span></div>
    <div class="detail-footer"><a id="product-link" class="solid" target="_blank" rel="noopener noreferrer">进入产品 ↗</a><span id="missing-link" class="muted">链接待接入</span><small id="demo-note">示例项目</small></div>
  </dialog>
  <noscript>请启用 JavaScript 以打开三维街区。</noscript>
  <script type="module" src="./app.js?v=render-cache-1"></script>
</body>
</html>
